<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tabela Peri&oacute;dica Acess&iacute;vel</title>

    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
  
  </head>

  <body class="body">
    <header>
      <!-- filtros primeira parte -->
      <nav class="barra-acessibilidade" aria-label="Menu de acessibilidade">
        <ul>
          <div>
            <li><a href="#conteudoPrincipal" accesskey="1"> <small>Ir para o conte&uacute;do<span class="badge">1</span></small> </a></li>
            <li><a href="#periodos" accesskey="2"> <small>Ir para menu<span class="badge">2</span></small> </a></li> 
            <li><a href="#opcoes" accesskey="3"> <small>Ir para opç&otilde;es de busca e filtro<span class="badge">3</span></small> </a></li>   
          </div>
      
          <div>
            <li>
              <button id="toggleThemeBtn"> <i id="themeIcon" class="bi bi-circle-half">&nbsp;</i> <span id="themeText">Trocar para Alto Contraste</span></button>
            </li>
          </div>
        </ul>
      </nav>
      
      <!-- filtros segunda parte -->
      <div class="filters"> 
        <div class="tittle">
          <h1>Tabela Peri&oacute;dica Acess&iacute;vel</h1>
        </div>

        <div id="opcoes">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="switchPesquisa">
            <label class="form-check-label" for="switchPesquisa">Busca ao vivo</label>
          </div>        
          

          <!-- Filtros -->
          <div class="searchOptions container px-0">
            <form id="formPesquisa" action="#" class="d-flex flex-wrap gap-2 align-items-end">

              <div class="form-floating flex-fill" style="min-width: 200px;">
                <input type="text" class="form-control" id="nomeFiltro"  placeholder="">
                <label for="nomeFiltro">Nome ou Símbolo</label>
              </div>

              <div class="form-floating" style="min-width: 180px;">
                <select class="form-select" id="filtroSerie" aria-label="Filtro por série">
                  <option value="">Todos</option>
                </select>
                <label for="filtroSerie">Filtrar por</label>
              </div>

              <div>
                <button type="button" class="btn btn-primary bi bi-search" id="btnPesquisa"></button>
              </div>

              <div>
                <button type="reset" class="btn btn-outline-primary bi bi-trash" id="btnResetPesquisa"></button>
              </div>

            </form>
          </div>

        </div>
      </div>

      <div>
        <ul id="periodos">
          <li><a href="#elemento1">  <small> Ir para o período 1</small> </a></li> 
          <li><a href="#elemento3">  <small> Ir para o período 2</small> </a></li> 
          <li><a href="#elemento11"> <small> Ir para o período 3</small> </a></li> 
          <li><a href="#elemento19"> <small> Ir para o período 4</small> </a></li> 
          <li><a href="#elemento37"> <small> Ir para o período 5</small> </a></li> 
          <li><a href="#elemento55"> <small> Ir para o período 6</small> </a></li> 
          <li><a href="#elemento87"> <small> Ir para o período 7</small> </a></li> 
        </ul>
        <div class="d-flex align-items-end gap-2" id="optionsView">
          <div class="form-floating" style="width: 8rem;">
            <select class="form-select" id="visualizacao" name="visualizacao" aria-label="Selecione o tipo de visualização">
              <option value="grid">Tabela</option>
              <option value="list">Lista</option>
            </select>
            <label for="visualizacao">Visualização</label>
          </div>

          <button id="toggleViewBtn" class="btn btn-primary" aria-label="Alterar">Ok</button>
        </div>

      </div>
    </header>

    <div class="container" id="containerTable">
      <!-- Tabela Periodica -->
      <div class="periodic-wrapper" id="conteudoPrincipal">
        <div class="periodic-table" role="table" aria-label="Elementos da tabela peri&oacute;dica">
          <!-- Elementos por Grid (via Js) -->
        </div>

        <div class="list-view d-none list-group list-group-checkable d-grid gap-2 border-0" role="list">
          <!-- Elementos por Lista (via Js) -->
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="elementModal" tabindex="-1" aria-labelledby="elementModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header" id="elementHeaderDetails">
            <h5 class="modal-title" id="elementModalLabel">Informa&ccedil;&otilde;es do elemento</h5>
            <button type="button" data-bs-dismiss="modal" aria-label="Fechar">X</button>



          </div>

          <div class="modal-body">
            <p id="elementDetails">
              <!-- informações (via Js) -->
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js" defer></script>

  </body>
</html>
