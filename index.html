<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tabela Peri&oacute;dica Acess&iacute;vel</title>

    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
  </head>

  <body class="body">
    <div class="container">
      <nav aria-label="atalhos">
        <ul>
          <li><a href="#conteudoPrincipal" accesskey="1">Ir para o conteúdo principal</a></li>
          <li><a href="#opcoes" accesskey="2">Ir para opções de busca e filtro</a></li>
          <li><a href="#elemento1" accesskey="3">Ir para o período 1</a></li>
          <li><a href="#elemento3" accesskey="4">Ir para o período 2</a></li>
          <li><a href="#elemento11" accesskey="5">Ir para o período 3</a></li>
          <li><a href="#elemento19" accesskey="6">Ir para o período 4</a></li>
          <li><a href="#elemento37" accesskey="7">Ir para o período 5</a></li>
          <li><a href="#elemento55" accesskey="8">Ir para o período 6</a></li>
          <li><a href="#elemento87" accesskey="9">Ir para o período 7</a></li>
        </ul>
      </nav>
      <h1 class="mb-4">Tabela Peri&oacute;dica Acess&iacute;vel</h1>

      <!-- Filtros -->
      <div class="controls d-flex flex-wrap gap-3 align-items-end">
        <div>
          <label for="filtroSerie" class="form-label">Filtrar por:</label>
          <select id="filtroSerie" class="form-select">
            <option value="">Todos</option>
          </select>
        </div>

        <div id="opcoes">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="switchPesquisa">
            <label class="form-check-label" for="switchPesquisa">Busca ao vivo</label>
          </div>
        
          <form id="formPesquisa" action="#">
            <label for="nomeFiltro" class="form-label">Pesquisa por Nome ou Símbolo</label>
            <input type="text" id="nomeFiltro" class="form-control" placeholder="ex: Oxigênio"/>
            <button type="button" id="btnPesquisa" class="btn btn-primary">Pesquisar</button>
            <button type="reset" id="btnResetPesquisa" class="btn btn-secondary">Limpar pesquisa</button>
          </form>
        </div>

        <button id="toggleViewBtn" class="btn btn-outline-primary">Alterar visualiza&ccedil;&atilde;o para lista</button>
        <button id="toggleThemeBtn" class="btn btn-outline-primary">Trocar para Alto Contraste</button>
      </div>

      <!-- Tabela Periodica -->
      <div class="periodic-wrapper" id="conteudoPrincipal">
        <div class="periodic-table" role="table" aria-label="Elementos da tabela peri&oacute;dica">
          <!-- Elementos por Grid (via Js) -->
        </div>

        <div class="list-view d-none list-group list-group-checkable d-grid gap-2 border-0" role="list">
          <!-- Elementos por Lista (via Js) -->
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="elementModal" tabindex="-1" aria-labelledby="elementModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="elementModalLabel">Informa&ccedil;&otilde;es do elemento</h5>
            <button type="button" data-bs-dismiss="modal" aria-label="Fechar">X</button>
          </div>

          <div class="modal-body">
            <p id="elementDetails">
              <!-- informações (via Js) -->
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
